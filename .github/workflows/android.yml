name: Build Moonlight Android APK

on:
  push:
    branches: [ "moonlight-noir" ]
  pull_request:
    branches: [ "moonlight-noir" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository (with submodules)
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 17

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3

    - name: Install NDK and write local.properties
      run: |
        # install specific NDK version (ubah versi bila perlu)
        sdkmanager --install "ndk;26.3.11579264"
        mkdir -p moonlight-android
        echo "ndk.dir=$ANDROID_SDK_ROOT/ndk/26.3.11579264" > moonlight-android/local.properties

    - name: Build APK (debug)
      working-directory: moonlight-android
      run: ./gradlew assembleDebug --no-daemon

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: Moonlight-Android-APK
        path: moonlight-android/app/build/outputs/apk/**/**/*.apk
